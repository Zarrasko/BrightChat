name: Check

# A push to `develop` builds, signs and publishes a release, so there is nowhere to find
# out whether something compiles without also shipping it. This runs on every other
# branch and does exactly that and nothing else — no keystore, no APK, no release.
# Same shape as gi-os/LightCamera's check.yml.
on:
  push:
    branches-ignore: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Resolving light-common from GitHub Packages, which has no anonymous read. The runner
      # exports GITHUB_ACTOR but not GITHUB_TOKEN, so the token has to be handed in. GPR_* wins
      # if set, for the case where a repo-scoped token is not accepted for another repo's package.
      GPR_USER: ${{ secrets.GPR_USER }}
      GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # `env -u CI` is load-bearing, and the reason needs writing down: build.gradle.kts
      # refuses to configure a release build with no keystore *while CI is set*, so that a
      # broken secret can never publish an APK signed with a throwaway key. That check runs
      # at configuration time, which means it fires for `assembleDebug` too — the release
      # block is evaluated either way. This job has no secrets on purpose and publishes
      # nothing, so it runs with CI unset and the guard correctly falls through to debug
      # signing. Setting `CI: ""` does not work: the guard tests for null, not for empty.
      - name: Compile
        run: |
          chmod +x ./gradlew
          env -u CI ./gradlew :app:assembleDebug --stacktrace

      # Same `env -u CI` reasoning as above: the release block is evaluated for any task.
      - name: Unit tests
        run: env -u CI ./gradlew :app:testDebugUnitTest --stacktrace
