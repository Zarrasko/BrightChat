name: Check

# A push to `develop` builds, signs and publishes a release, so there is nowhere to find
# out whether something compiles without also shipping it. This runs on every other
# branch and does exactly that and nothing else — no keystore, no APK, no release.
# Same shape as gi-os/LightCamera's check.yml.
on:
  push:
    branches-ignore: [develop, main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # assembleDebug rather than assembleRelease: the release build fails by design when
      # the keystore secret is absent (see app/build.gradle.kts), and this job deliberately
      # has no secrets. Debug compiles the same sources.
      - name: Compile
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace
